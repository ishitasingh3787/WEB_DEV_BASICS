<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
      body{
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #1a1a1a;
        color:#fff;
      }  
      .nav-container {
        margin-bottom: 40px;
      }
      h2{
        margin-bottom: 10px;       
      }
      .nav1{
        background-color: #f8f9fa;
        padding: 10px;
      }
      .nav1 ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-around;
      }
      .nav1 li{
        display:inline;
      }
      .nav1 a{
        text-decoration: none; /* Remove underline */
        color: #333;
        padding: 5px 10px;
       /* background-color: #c42fa4;*/
       position: relative;
      }
      .nav1 .login-btn{
        background-color: #2f2fc4;
        color: #fff;
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor: pointer;
      }
      .nav1 a::after{
        content: '';
        position: absolute;
        width: 100%;
        height: 2px;
        bottom:0;
        left:0;
        background-color: #2f2fc4;
        transform:scaleX(0);
        transition: transform 0.3s ease-in-out;
      }
      .nav1 a:hover::after{
        transform: scaleX(1);
   }
   .nav2{
     background-color: #f8f9fa;
     width: 200px;
     padding: 10px;
   }
   .nav2 ul{
     list-style-type: none;
     margin: 0;
     padding: 0;
   }
   .nav2 li{
     margin-bottom: 12px;
   }
   .nav2 a{
     text-decoration: none;
     color: #3919ec;
     padding:  10px;
     display: block;
     width: 100%;
    }
    .nav2 a:hover{
      background-color: #3919ec;
      color: #fff;
      border-radius: 5px;
    }
    .nav2 .login-btn{
      background-color: #2f2fc4;
      color: #fff;
      border: none;
      padding: 5px 15px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    .nav2 .login-btn:hover{
      background-color: #140c3e;
    }
    .nav3{
      background-color: #027ffb;
      padding: 10px;
    }
    .nav3 ul{
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    /* now as div is a block element it will take the full width of the parent container and the dropdown content will be positioned relative to the parent li */
    .nav3 a{
        text-decoration: none;
        color: #efeeee;
        padding: 5px 10px;
        position: relative;
        display: block;
    }
    .nav3 .dropdown-content{
        display: none;
    }
    .nav3 .dropdown:hover .dropdown-content{
        display: block;
        position: absolute;/* position absolute takes the element out of the normal flow of the document and positions it relative to its nearest positioned ancestor. In this case, the nearest positioned ancestor is the parent li element with class dropdown. */
        background-color: #0a0a0a;
        min-width: 160px;
    }


    </style>
</head>
<body>
    <div class="nav-container">
        <h2>Variation 1:Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
    <div class="nav-container">
        <h2>Variation 2: Vertical with hover effect</h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
    <div class="nav-container">
        <h2>Variation 3: Horizontal with hover effect</h2>
        <nav class="nav3">
            <ul>
                <li><a href="#">Home</a></li>
                <li class="dropdown">
                    <a href="#">Services</a>
                    <ul class="dropdown-content">
                        <li><a href="#">Web Design</a></li>
                        <li><a href="#">Development</a></li>
                        <li><a href="#">Marketing</a></li>
                    </ul>
                </li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
</body>
</html>
