<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings and Lists</title>
</head>
<body>
    <div>
        <h1>block elements</h1>
        <ul>
            <li>ol,li</li>
            <li>li</li>
            <li>p</li>
        </ul>
    </div>
    <div>
        <h1>Inline elements</h1>
        <ul>
            <li>span</li>
            <li>a</li>
            <li>strong</li>
            <li>em</li>
        </ul>
    </div>
    <p>This is a <strong>paragraph</strong> element.</p>
    <p>This is a <em>paragraph</em> element.</p>

</body>
</html>
